<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f0a2e"/><stop offset=".6" stop-color="#2e1065"/><stop offset="1" stop-color="#6b21a8"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#fdba74"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#78350f"/><stop offset=".5" stop-color="#a16207"/><stop offset="1" stop-color="#78350f"/></linearGradient>
    <radialGradient id="bulb"><stop offset="0" stop-color="#fef9c3"/><stop offset=".4" stop-color="#fde047"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient>
    <radialGradient id="flameglow"><stop offset="0" stop-color="#fde047" stop-opacity=".8"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient>
    <radialGradient id="kandil" cx="50%" cy="55%"><stop offset="0" stop-color="#fef3c7"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
    <pattern id="stripe" width="120" height="80" patternUnits="userSpaceOnUse"><rect width="60" height="80" fill="#6b21a8"/><rect x="60" width="60" height="80" fill="#fbbf24"/></pattern>
    <g id="m"><circle r="9" fill="#f97316"/><circle r="5" fill="#fb923c"/><circle r="2" fill="#c2410c"/></g>
    <g id="my"><circle r="9" fill="#facc15"/><circle r="5" fill="#fde047"/><circle r="2" fill="#ca8a04"/></g>
    <g id="diya">
      <circle cy="-18" r="16" fill="url(#flameglow)"/>
      <path d="M0 -30 C6 -21 5 -13 0 -10 C-5 -13 -6 -21 0 -30Z" fill="#f97316"/>
      <path d="M0 -24 C3 -18 3 -14 0 -12 C-3 -14 -3 -18 0 -24Z" fill="#fde047"/>
      <path d="M-18 -8 Q0 -10 18 -8 Q14 6 0 7 Q-14 6 -18 -8Z" fill="#c2410c"/>
      <path d="M-18 -8 Q0 -3 18 -8" fill="none" stroke="#fdba74" stroke-width="2"/>
    </g>
    <g id="burst" stroke-linecap="round" stroke-width="3">
      <path d="M0 -40 V-14 M0 40 V14 M-40 0 H-14 M40 0 H14 M-28 -28 L-10 -10 M28 28 L10 10 M28 -28 L10 -10 M-28 28 L-10 10"/>
    </g>
    <g id="kan">
      <path d="M0 -110 V-60" stroke="#1c1917" stroke-width="2"/>
      <path d="M0 -60 L30 -30 L0 0 L-30 -30Z" fill="url(#kandil)" stroke="#9a3412" stroke-width="2"/>
      <path d="M0 -60 V0 M-30 -30 H30" stroke="#9a3412" stroke-width="1.5" opacity=".6"/>
      <path d="M-10 0 V26 M0 0 V32 M10 0 V26" stroke="#db2777" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="460" fill="url(#sky)"/>
  <g fill="#fef3c7" opacity=".8"><circle cx="90" cy="60" r="2"/><circle cx="300" cy="40" r="1.5"/><circle cx="1040" cy="70" r="2"/><circle cx="880" cy="30" r="1.5"/><circle cx="640" cy="20" r="1.5"/><circle cx="450" cy="70" r="1.2"/><circle cx="1150" cy="40" r="1.5"/></g>

  <!-- fireworks -->
  <g transform="translate(70 70)" stroke="#f472b6" opacity=".9"><use href="#burst"/><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></g>
  <g transform="translate(1130 80) scale(.8)" stroke="#fde047" opacity=".9"><use href="#burst"/><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></g>
  <g transform="translate(40 200) scale(.6)" stroke="#67e8f9" opacity=".8"><use href="#burst"/><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></g>
  <g transform="translate(1165 210) scale(.55)" stroke="#fb923c" opacity=".8"><use href="#burst"/><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></g>

  <!-- back wall of the stall -->
  <rect x="120" y="110" width="960" height="350" fill="url(#wall)"/>
  <!-- rangoli painted on the wall -->
  <g transform="translate(600 300)" opacity=".5">
    <circle r="110" fill="#fb923c" opacity=".35"/>
    <g fill="#db2777">
      <ellipse cy="-70" rx="16" ry="34"/><ellipse cy="-70" rx="16" ry="34" transform="rotate(45)"/><ellipse cy="-70" rx="16" ry="34" transform="rotate(90)"/><ellipse cy="-70" rx="16" ry="34" transform="rotate(135)"/>
      <ellipse cy="-70" rx="16" ry="34" transform="rotate(180)"/><ellipse cy="-70" rx="16" ry="34" transform="rotate(225)"/><ellipse cy="-70" rx="16" ry="34" transform="rotate(270)"/><ellipse cy="-70" rx="16" ry="34" transform="rotate(315)"/>
    </g>
    <circle r="36" fill="#0891b2"/><circle r="18" fill="#facc15"/>
  </g>

  <!-- shelves with diyas -->
  <g>
    <rect x="160" y="240" width="260" height="10" fill="#92400e"/>
    <rect x="780" y="240" width="260" height="10" fill="#92400e"/>
    <use href="#diya" x="195" y="232"/><use href="#diya" x="255" y="232"/><use href="#diya" x="315" y="232"/><use href="#diya" x="375" y="232"/>
    <use href="#diya" x="825" y="232"/><use href="#diya" x="885" y="232"/><use href="#diya" x="945" y="232"/><use href="#diya" x="1005" y="232"/>
    <rect x="160" y="340" width="260" height="10" fill="#92400e"/>
    <rect x="780" y="340" width="260" height="10" fill="#92400e"/>
    <g transform="translate(220 340)"><rect x="-26" y="-36" width="52" height="36" rx="4" fill="#db2777"/><rect x="-4" y="-36" width="8" height="36" fill="#fde047"/></g>
    <g transform="translate(300 340)"><rect x="-22" y="-44" width="44" height="44" rx="4" fill="#7c3aed"/><rect x="-22" y="-26" width="44" height="8" fill="#fde047"/></g>
    <g transform="translate(375 340)"><rect x="-24" y="-30" width="48" height="30" rx="4" fill="#16a34a"/><rect x="-3" y="-30" width="6" height="30" fill="#fde047"/></g>
    <g transform="translate(830 340)"><path d="M-30 0 Q0 -6 30 0 Q24 -2 0 -40 Q-24 -2 -30 0Z" fill="#f59e0b"/></g>
    <g transform="translate(910 340)"><rect x="-24" y="-40" width="48" height="40" rx="4" fill="#e11d48"/><rect x="-24" y="-24" width="48" height="8" fill="#fde047"/></g>
    <g transform="translate(985 340)"><rect x="-22" y="-34" width="44" height="34" rx="4" fill="#0891b2"/><rect x="-3" y="-34" width="6" height="34" fill="#fde047"/></g>
  </g>

  <!-- wooden pillars -->
  <rect x="96" y="96" width="34" height="364" fill="url(#wood)"/>
  <rect x="1070" y="96" width="34" height="364" fill="url(#wood)"/>

  <!-- striped awning with scalloped edge -->
  <path d="M60 30 H1140 L1110 110 H90Z" fill="url(#stripe)"/>
  <path d="M60 30 H1140" stroke="#3b0764" stroke-width="8"/>
  <path d="M90 110 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 q30 30 60 0 Z" fill="#6b21a8"/>
  <path d="M90 110 H1110" stroke="#facc15" stroke-width="3"/>

  <!-- marigold toran -->
  <g>
    <use href="#m" x="160" y="148"/><use href="#my" x="182" y="160"/><use href="#m" x="206" y="168"/><use href="#my" x="232" y="172"/><use href="#m" x="258" y="172"/><use href="#my" x="284" y="168"/><use href="#m" x="308" y="160"/><use href="#my" x="330" y="148"/>
    <use href="#m" x="870" y="148"/><use href="#my" x="892" y="160"/><use href="#m" x="916" y="168"/><use href="#my" x="942" y="172"/><use href="#m" x="968" y="172"/><use href="#my" x="994" y="168"/><use href="#m" x="1018" y="160"/><use href="#my" x="1040" y="148"/>
  </g>
  <g>
    <use href="#m" x="113" y="150"/><use href="#my" x="113" y="170"/><use href="#m" x="113" y="190"/><use href="#my" x="113" y="210"/><use href="#m" x="113" y="230"/><use href="#my" x="113" y="250"/>
    <use href="#m" x="1087" y="150"/><use href="#my" x="1087" y="170"/><use href="#m" x="1087" y="190"/><use href="#my" x="1087" y="210"/><use href="#m" x="1087" y="230"/><use href="#my" x="1087" y="250"/>
  </g>

  <!-- string lights -->
  <path d="M0 14 Q300 60 600 14 Q900 60 1200 14" fill="none" stroke="#1c1917" stroke-width="2"/>
  <g>
    <circle cx="60" cy="22" r="14" fill="url(#bulb)"/><circle cx="160" cy="34" r="14" fill="url(#bulb)"/><circle cx="260" cy="38" r="14" fill="url(#bulb)"/><circle cx="360" cy="36" r="14" fill="url(#bulb)"/><circle cx="460" cy="30" r="14" fill="url(#bulb)"/><circle cx="560" cy="18" r="14" fill="url(#bulb)"/>
    <circle cx="660" cy="22" r="14" fill="url(#bulb)"/><circle cx="760" cy="34" r="14" fill="url(#bulb)"/><circle cx="860" cy="38" r="14" fill="url(#bulb)"/><circle cx="960" cy="36" r="14" fill="url(#bulb)"/><circle cx="1060" cy="30" r="14" fill="url(#bulb)"/><circle cx="1160" cy="18" r="14" fill="url(#bulb)"/>
  </g>

  <!-- hanging akash kandils -->
  <use href="#kan" x="450" y="230"/>
  <use href="#kan" x="750" y="230"/>
  <use href="#kan" x="600" y="200"/>
</svg>
